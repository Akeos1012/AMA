<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AMA LMS - Admin Dashboard</title>
    <link rel="stylesheet" href="../../css/admin.css" />
  </head>

  <body>
    <div class="dashboard">

      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <h1>AMA LMS</h1>
          <p>Admin Portal</p>
        </div>

        <nav class="sidebar-nav">
          <a href="admin_dashboard.html" class="nav-link active">
            Dashboard
          </a>

          <a href="users.html" class="nav-link">
            Users
          </a>

          <a href="classes.html" class="nav-link">
            Classes
          </a>

          <a href="subjects.html" class="nav-link">
            Subjects
          </a>

          <a href="settings.html" class="nav-link">
            Settings
          </a>
        </nav>

        <div class="sidebar-footer">
          <a href="../index.html" class="logout-link">
            Logout
          </a>
        </div>
      </aside>

      <!-- Main Content -->
      <main class="dashboard-content">

        <header class="dashboard-header">
          <div>
            <h2>Admin Dashboard</h2>
            <p>Welcome back, Administrator</p>
          </div>
        </header>

        <!-- Summary Cards -->
        <section class="dashboard-cards">

          <div class="dashboard-card">
            <h3>Students</h3>
            <p>0</p>
            <span>Registered students</span>
          </div>

          <div class="dashboard-card">
            <h3>Teachers</h3>
            <p>0</p>
            <span>Registered teachers</span>
          </div>

          <div class="dashboard-card">
            <h3>Classes</h3>
            <p>0</p>
            <span>Active classes</span>
          </div>

          <div class="dashboard-card">
            <h3>Subjects</h3>
            <p>0</p>
            <span>Available subjects</span>
          </div>

        </section>

        <!-- System Overview -->
        <section class="dashboard-section">

          <div class="section-header">
            <h3>System Overview</h3>
          </div>

          <div class="empty-state">
            <p>No system activity yet.</p>
          </div>

        </section>

      </main>
    </div>

    <script type="module" src="../../js/admin.js"></script>
  </body>
</html>
